<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Adsorption Predictor{% endblock %} · Phosphate adsorption on biochar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head><body>
<header><div class="bar">
  <a class="brand" href="{{ url_for('home') }}"><span class="logo">🌿</span> Adsorption <small>RSM vs ANN</small></a>
  <nav>
    <a href="{{ url_for('home') }}" class="{{ 'on' if request.endpoint == 'home' }}">Predict</a>
    <a href="{{ url_for('results') }}" class="{{ 'on' if request.endpoint in ('results','version_page','view') }}">Results</a>
  </nav>
</div></header>
<main>{% block body %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body></html>
